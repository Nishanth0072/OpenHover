worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- Basic Settings ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/event-stream;

    # --- Rate Limiting Zone ---
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # --- Upstream: FastAPI Application ---
    upstream openbrain_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # --- Health Check (Nginx-level) ---
        location /nginx-health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # --- API Routes ---
        location / {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            # Proxy to FastAPI
            proxy_pass http://openbrain_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- SSE Support ---
            # Disable buffering for streaming responses (critical for SSE)
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;

            # Longer timeouts for streaming connections
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
